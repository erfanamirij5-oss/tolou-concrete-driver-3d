name: Quality

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Prepare offline runtime vendor
        run: npm run vendor:sync
      - name: Verify required files
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/game.js
          test -f src/platform/persistence.js
          test -f src/persistence/session-state.js
          test -f electron/main.js
          test -f electron/preload.js
          test -f electron/persistence.js
          test -f vendor/babylon.js
          test -f scripts/verify-windows-install.ps1
          test -f docs/ARCHITECTURE.md

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS installer
        run: npm run dist:win
      - name: Install, launch, and uninstall packaged application
        shell: powershell
        run: ./scripts/verify-windows-install.ps1
      - name: Upload RC installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolou-concrete-driver-windows-rc
          path: dist/TolouConcreteDriver-Setup-*.exe
          if-no-files-found: error
