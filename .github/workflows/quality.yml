name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check src/game.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/game.js
          test -f docs/ARCHITECTURE.md
