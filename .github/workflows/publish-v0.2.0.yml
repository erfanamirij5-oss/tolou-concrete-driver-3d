name: Publish v0.2.0

on:
  push:
    branches:
      - release/publish-v0.2.0

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: 7d22bcd99b91d0057ee020c7444cb18e44515985
          fetch-depth: 0

      - name: Verify accepted source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7d22bcd99b91d0057ee020c7444cb18e44515985"

      - name: Download accepted Windows artifact from green Run 115
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download 34659670820 \
            --repo "${GITHUB_REPOSITORY}" \
            --name tolou-concrete-driver-windows-rc \
            --dir release-artifact
          find release-artifact -maxdepth 2 -type f -print

      - name: Verify installer exists
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find release-artifact -type f -name 'TolouConcreteDriver-Setup-0.2.0.exe' -print -quit)"
          test -n "$installer"
          test -s "$installer"
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          sha256sum "$installer"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "Tag v0.2.0 already exists; verifying target."
            existing="$(git ls-remote origin refs/tags/v0.2.0 | awk '{print $1}')"
            test "$existing" = "7d22bcd99b91d0057ee020c7444cb18e44515985"
          else
            git tag v0.2.0 7d22bcd99b91d0057ee020c7444cb18e44515985
            git push origin refs/tags/v0.2.0
          fi

          if gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; ensuring installer is attached."
            gh release upload v0.2.0 "$INSTALLER" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create v0.2.0 "$INSTALLER" \
              --repo "${GITHUB_REPOSITORY}" \
              --target 7d22bcd99b91d0057ee020c7444cb18e44515985 \
              --title "Tolou Concrete Driver 3D v0.2.0" \
              --notes-file docs/RELEASE_NOTES_v0.2.0.md
          fi
